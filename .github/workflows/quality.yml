name: Validate research site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML, navigation, and source inventory
        run: python3 scripts/validate_repo.py
      - name: Check JavaScript syntax
        run: |
          for file in docs/assets/*.js tests/*.cjs; do
            node --check "$file"
          done
      - name: Run feedback demonstration regression tests
        run: node --test tests/*.test.cjs
